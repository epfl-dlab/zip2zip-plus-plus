# ============================================================================
# Evaluation presets for scripts/eval_harness.py
# ============================================================================
#
# Usage:
#   python scripts/eval_harness.py --preset default \
#       --ckpt_dir /path/to/step_N --resume_wandb_id none
#
#   python scripts/eval_harness.py --preset smoke \
#       --ckpt_dir /path/to/step_N --resume_wandb_id none
#
# On the EPFL RCP cluster (Run:AI / SLURM):
#   sbatch --export=ALL,CHECKPOINT=/path/to/step_N \
#       scripts/eval_harness.sbatch
#   (add PRESET=default or PRESET=smoke to the --export list
#    if the sbatch is updated to pass --preset)
#
#   Or directly:
#   python scripts/eval_harness.py --preset default \
#       --ckpt_dir /path/to/step_N --resume_wandb_id none
#
# Validation plan
# ---------------
# The `default` preset is designed to match the paper's Table 3 setup
# (2506.01084v2). To verify the pipeline produces correct results, run
# standard lm-eval (not through the zip2zip adapter) on the base
# microsoft/Phi-3.5-mini-instruct model with the same 2-shot setting,
# and compare against the paper's "Base" row for Phi-3.5-4B:
#
#   ARC-c   ARC-e   HS      OBQA    PIQA    WG      GSM8K
#   0.60    0.83    0.66    0.46    0.79    0.75    0.82
#
# This validation step uses standard lm-eval, not eval_harness.py:
#
#   lm_eval --model hf \
#       --model_args pretrained=microsoft/Phi-3.5-mini-instruct \
#       --tasks arc_challenge,arc_easy,hellaswag,openbookqa,piqa,winogrande,gsm8k \
#       --num_fewshot 2 \
#       --device cuda \
#       --batch_size 1
#
# If those numbers match, the benchmark configuration is correct and
# results from eval_harness.py (which uses the same tasks/settings
# through the zip2zip adapter) are trustworthy for comparing zip2zip
# checkpoints.
#
# The model microsoft/Phi-3.5-mini-instruct is already cached in the
# HF cache on the machine.
# ============================================================================

presets:
  default:
    description: "2-shot MC + generation benchmarks (paper Table 3 set + triviaqa)"
    tasks: [arc_challenge, arc_easy, hellaswag, openbookqa, piqa, winogrande, gsm8k, triviaqa]
    num_fewshot: 2
    max_length: 4096
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234
    apply_chat_template: true
    fewshot_as_multiturn: true

  perplexity:
    description: "Byte-level perplexity on four corpora (matches paper Table 3, 1024-token window)"
    tasks: [wikitext, zip2zip_pile, zip2zip_mc4, zip2zip_dc4]
    num_fewshot: 0
    max_length: 1024
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234

  # Quick variant of `perplexity`: full wikitext (small, stays 1:1 comparable
  # with final/wikitext) plus pinned 1000-document subsets of Pile/mC4/dC4
  # (see scripts/lm_eval_tasks/*_sub1k.yaml — same documents every run, or a
  # hard error). Every scoring knob must stay identical to `perplexity`; only
  # the tasks differ. eval_ckpt_rcp.sh logs these runs under subset_ppl/ so
  # subset numbers never share a panel with full-corpus numbers.
  perplexity_subset:
    description: "Quick perplexity: full wikitext + pinned 1k-doc subsets of Pile/mC4/dC4 (1024-token window, logged under subset_ppl/)"
    tasks: [wikitext, zip2zip_pile_sub1k, zip2zip_mc4_sub1k, zip2zip_dc4_sub1k]
    num_fewshot: 0
    max_length: 1024
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234

  # Post-SFT generation benchmarks for the paper's Table 2 (its GSM8K column
  # comes from `default`). No num_fewshot key on purpose: a preset value is a
  # GLOBAL override in simple_evaluate, and these tasks have different
  # protocols — math500 uses its 4 fixed Minerva exemplars, humaneval_instruct
  # and ifeval are 0-shot — so each task keeps its own. humaneval_instruct
  # executes generated code: eval_ckpt_rcp.sh exports HF_ALLOW_CODE_EVAL=1 for
  # this preset and eval_harness.py passes confirm_run_unsafe_code from it.
  postsft:
    description: "Post-SFT generation benchmarks (paper Table 2): MATH-500 (Minerva 4-shot; strict=exact_match, flex=math_verify), HumanEval-instruct pass@1, IFEval prompt-level strict — per-task few-shot, chat template"
    tasks: [math500, humaneval_instruct, ifeval]
    max_length: 4096
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234
    apply_chat_template: true
    fewshot_as_multiturn: true

  default_base:
    description: "2-shot MC benchmarks for from-scratch (non-instruct) models — no chat template"
    tasks: [arc_challenge, arc_easy, hellaswag, openbookqa, piqa, winogrande, gsm8k, triviaqa]
    num_fewshot: 2
    max_length: 4096
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234
    apply_chat_template: false
    fewshot_as_multiturn: false

  smoke:
    description: "Quick sanity check — all tasks, 20 samples each, no W&B"
    tasks: [arc_challenge, arc_easy, hellaswag, openbookqa, piqa, winogrande, gsm8k, triviaqa]
    num_fewshot: 2
    max_length: 4096
    eval_mode: compressed
    batch_size: 1
    dtype: bfloat16
    seed: 1234
    apply_chat_template: true
    fewshot_as_multiturn: true
    limit: 20
    no_wandb: true
