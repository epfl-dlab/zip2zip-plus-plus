# Token-aware repeated-window WikiText stress test. The released artifact is
# Phi-3.5-specific and pinned to the version used for the paper experiments.
# This task remains absent from every default preset and pipeline. Every row is
# at most 1000 base tokens, so the 1024-token perplexity preset scores it in one
# rolling window and one freshly initialized LZW state.
task: zip2zip_wikitext_repeat4
dataset_path: epfl-dlab/zip2zip-wikitext-repeat-phi35
dataset_name: repeat4
dataset_kwargs:
  revision: v1.0.0
test_split: test
output_type: loglikelihood_rolling
doc_to_text: ""
doc_to_target: !function utils.doc_to_target
process_results: !function utils.repeated_wikitext_process_results
should_decontaminate: false
metric_list:
  - metric: word_perplexity
  - metric: byte_perplexity
  - metric: bits_per_byte
metadata:
  version: 1.0
  protocol: repeated_token_block
  dataset_revision: v1.0.0
  expected_tokenizer: microsoft/Phi-3.5-mini-instruct
  repeat_n: 4
  max_base_tokens_per_row: 1000
