# Paper benchmark mC4 (C4/en): rolling perplexity on the validation shard below.
# See docs/evaluation.md for the corpus mapping and paper subset preset.
task: zip2zip_mc4
dataset_path: allenai/c4
test_split: validation
# Pin one validation shard explicitly (≈45k docs / ≈400MB) so HF only fetches
# what we need — never the 800GB train split. Streaming would also work in
# principle but breaks ConfigurableTask init in lm-eval 0.4.11.
dataset_kwargs:
  data_files:
    validation: en/c4-validation.00000-of-00008.json.gz
output_type: loglikelihood_rolling
doc_to_text: ""
doc_to_target: !function utils.doc_to_target
should_decontaminate: false
metric_list:
  - metric: word_perplexity
  - metric: byte_perplexity
  - metric: bits_per_byte
metadata:
  version: 1.0
